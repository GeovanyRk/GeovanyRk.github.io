<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Widget de Stream — Halloween 2026 · GeoArmy</title>
  <meta name="description" content="Overlay de solo lectura para OBS Browser Source — La Heraldo, Halloween 2026. Muestra el HP de Morvanna y la resistencia de Geo Army en tiempo real, sin login ni navegación."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/halloween-stream-widget.css"/>
  <!-- ======================================================================
       WIDGET OFICIAL DE STREAM — Halloween 2026 (OBS Browser Source)
       ======================================================================
       Página de PRODUCCIÓN, aislada, SOLO LECTURA. Pensada para pegarse
       como Browser Source encima del gameplay:
         - SIN navbar, SIN footer, SIN login visible, SIN página completa.
         - SIN scroll (html/body con overflow:hidden).
         - html/body con background transparente (ver
           css/halloween-stream-widget.css) para que se vea el juego debajo.
         - Tamaño recomendado en OBS: 700 x 220-250 px (responsive: se
           adapta a cualquier otro tamaño de Browser Source).

       REDISEÑO VISUAL (2026-09-26): jerarquía tipo "boss bar" de
       videojuego (retrato + nombre/título + HP numérico arriba, barra
       principal gruesa debajo, Geo Army claramente secundaria, último
       movimiento en una sola línea, capa dedicada de Cataclismo).

       PASADA FINAL TEST -> PRODUCCIÓN (2026-09-26): se retiró por completo
       el modo demo (?demo=..., tag "MODO DEMO") -- ver cabecera de
       js/halloween-stream-widget.js. El widget ahora arranca SIEMPRE
       contra las RPC reales.

       Cliente Supabase: el widget solo necesita
       window.GeoArmyAccount.client. Se reutiliza EXACTAMENTE el mismo
       cliente anon que ya usan batalla.html/rol.html/contratos.html, vía
       geoarmy-config.js + geoarmy-account.js (geoarmy-account.js ya
       funciona sin el contenedor #geoAccountWidget) -- js/premium.js y
       js/geoarmy-ranks.js NO se cargan aquí porque no aportan nada a este
       widget de solo lectura. js/halloween-stream-widget.js espera a que
       ese cliente exista (igual que hace js/halloween-2026.js) -- NUNCA
       crea un cliente nuevo, NUNCA usa service_role. Esta página no
       incluye NINGÚN contenedor de cuenta (login/avatar/#geoAccountWidget).

       Este widget es de SOLO LECTURA: llama ÚNICAMENTE
       halloween_2026_get_public_state() y
       halloween_2026_get_public_feed({ p_limit: 30 }). Nunca escribe nada,
       nunca consulta tablas halloween_2026_* directamente, nunca calcula
       daño/HP/resultado -- todo el estado autoritativo viene de Supabase.
       ====================================================================== -->
</head>
<body data-halloween-widget="stream-widget">
  <div id="hswRoot" class="hsw-root" data-state="loading" data-phase="1" data-cataclysm="0" data-outcome="none">

    <div id="hswReconnect" class="hsw-reconnect" hidden title="Reconectando con Supabase…">⟳</div>

    <!-- HEADER — fila superior tipo "boss bar": retrato + nombre/título +
         HP numérico grande. Visible en 'scheduled'/'battle'/'finished'
         (oculto solo en 'loading', ver CSS). El retrato depende
         EXCLUSIVAMENTE de boss_phase (nunca de HP) -- ver
         updatePortrait()/updateSubtitle() en js/halloween-stream-widget.js,
         los únicos agregados de lógica permitidos en esta pasada. #hswPhaseBadge
         se conserva en el DOM (la lógica que lo rellena -- applyPhase() --
         no se tocó) pero queda oculto vía CSS: el subtítulo ahora cumple
         ese rol visualmente. -->
    <div id="hswHeader" class="hsw-header">
      <div class="hsw-portrait-wrap">
        <img id="hswPortrait" class="hsw-portrait-img" alt="Morvanna" hidden />
        <div id="hswPortraitFallback" class="hsw-portrait-fallback" aria-hidden="true">M</div>
      </div>
      <div class="hsw-header-mid">
        <div class="hsw-boss-name">MORVANNA</div>
        <div id="hswSubtitle" class="hsw-boss-subtitle">LA HERALDO</div>
        <span id="hswPhaseBadge" class="hsw-phase-badge" hidden>FASE I</span>
      </div>
      <!-- Mismo elemento/ID que ya rellenaba renderBars() (fmtNum tal cual
           boss_hp/boss_max_hp) -- solo se reubicó aquí y se le agrandó la
           tipografía por CSS; renderBars() en JS no cambió. -->
      <div id="hswBossText" class="hsw-hp-numeric">— / — HP</div>
    </div>

    <!-- SCHEDULED (status === 'scheduled'): versión discreta, antes del
         inicio real, con el retrato de Fase I atenuado (CSS). NO simula
         HP moviéndose. -->
    <div id="hswScheduledPanel" class="hsw-panel hsw-panel-scheduled">
      <div class="hsw-scheduled-title">BATALLA DE HALLOWEEN</div>
      <div class="hsw-scheduled-sub">1 OCT · 7:00 PM ET</div>
    </div>

    <!-- FINISHED (status === 'finished'): título de resultado. Las barras
         con el HP final se muestran en #hswBars, más abajo (compartido con
         la vista de batalla activa -- "Mantener HP finales visibles"). -->
    <div id="hswFinishedBanner" class="hsw-panel hsw-panel-finished">
      <div id="hswFinishedTitle" class="hsw-finished-title"></div>
      <div id="hswFinishedSub" class="hsw-finished-sub"></div>
    </div>

    <!-- BARRAS — vista normal de batalla en curso, y también vista final
         (con outcome ya decidido) reutilizando el mismo bloque. Oculto
         solo en 'scheduled'/'loading'. Los valores SOLO representan
         boss_hp/boss_max_hp/geoarmy_hp/geoarmy_max_hp tal como llegan de
         Supabase -- nunca se calculan aquí. Barra de Morvanna ahora
         gruesa (barra principal de la boss bar); Geo Army se mantiene
         más delgada, claramente secundaria. -->
    <div id="hswBars" class="hsw-bars">
      <div class="hsw-bar hsw-bar-boss"><div id="hswBossFill" class="hsw-bar-fill"></div></div>
      <div class="hsw-row hsw-row-geo">
        <div class="hsw-row-head"><span class="hsw-name">GEO ARMY</span></div>
        <div class="hsw-bar hsw-bar-geo"><div id="hswGeoFill" class="hsw-bar-fill"></div></div>
        <div id="hswGeoText" class="hsw-bar-text">— / — HP</div>
      </div>
      <!-- Último movimiento relevante (uno solo, nunca una lista/historial).
           Ya NO la usa Cataclismo (ver capa dedicada más abajo) -- misma
           lógica de cola/dedupe, solo cambió a qué elemento escribe. -->
      <div id="hswBottomLine" class="hsw-bottom-line" hidden></div>
    </div>

    <!-- Capa de emergencia de Cataclismo -- NUEVA, ADICIONAL: no oculta el
         retrato ni las barras (siguen visibles arriba). Countdown = mismo
         cálculo de siempre (pending_resolves_at vs Date.now(), SOLO
         presentación, nunca resuelve nada ni toca HP) -- ver
         renderCataclysm() en js/halloween-stream-widget.js. -->
    <div id="hswCataclysmLayer" class="hsw-cataclysm-layer" hidden>
      <div class="hsw-cataclysm-title">⚠ CATACLISMO</div>
      <div id="hswCataclysmTimer" class="hsw-cataclysm-timer">00:00</div>
      <div class="hsw-cataclysm-sub">PREPAREN LAS DEFENSAS</div>
    </div>

    <!-- Transición de fase 1 -> 2 detectada en la misma sesión (nunca se
         calcula por HP, siempre por boss_phase). Overlay transitorio
         ~1.8s, puramente visual. -->
    <div id="hswPhaseFlash" class="hsw-phase-flash" hidden>
      <div class="hsw-phase-flash-title">EL SELLO SE HA ROTO</div>
      <div class="hsw-phase-flash-sub">FASE II</div>
    </div>
  </div>

  <!-- ===== Cliente Supabase compartido -- solo lo estrictamente necesario
       para obtener window.GeoArmyAccount.client (ver comentario de
       cabecera). NO se cargan js/premium.js ni js/geoarmy-ranks.js: este
       widget no tiene login ni contenedor de cuenta, y geoarmy-account.js
       ya funciona sin ellos. ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/geoarmy-config.js"></script>
  <script src="../js/geoarmy-account.js"></script>
  <script src="../js/halloween-stream-widget.js"></script>
</body>
</html>
