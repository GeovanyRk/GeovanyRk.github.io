<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Guard centralizado del evento de Halloween — DEBE ser el primer
       script del <head>, antes de cualquier otro recurso, para bloquear
       la página antes de que llegue a mostrarse. Ver
       halloween/js/halloween-event-guard.js (única bandera para
       reactivar el evento más adelante). -->
  <script src="js/halloween-event-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contratos — Halloween 2026 · GeoArmy</title>
  <meta name="description" content="Halloween 2026 — Contratos de Fortnite, Overwatch y stream contra La Heraldo."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="../css/v3-theme.css"/>
  <link rel="stylesheet" href="../css/halloween-2026.css"/>
</head>
<!-- data-halloween-page="missions": el router carga los contratos activos
     (halloween_2026_get_public_missions), los claims públicos, la fecha de
     la próxima oleada, mi participación/rol y mi contrato activo (claims
     individuales por rol: atacante/soporte/defensor), con un poll de 20s.
     No toca estado de batalla, efectos ni feed. -->
<body data-halloween-page="missions">

  <div class="v3-page">
    <div class="v3-stars"></div>
    <img src="../nebula-tl.webp" alt="" class="v3-nebula v3-nebula-tl"/>
    <img src="../nebula-tr.webp" alt="" class="v3-nebula v3-nebula-tr"/>
    <img src="../nebula-bl.webp" alt="" class="v3-nebula v3-nebula-bl"/>
    <img src="../nebula-br.webp" alt="" class="v3-nebula v3-nebula-br"/>

    <nav class="v3-nav">
      <div class="v3-nav-inner">
        <a href="../index.html" class="v3-logo nav-logo">
          <span class="v3-logo-mark"><img src="../logo.png" alt="GeoArmy"/></span>
          <span class="v3-wordmark">GEO ARMY</span>
        </a>
        <div class="v3-auth">
          <div id="geoAccountWidget"></div>
          <a href="https://twitch.tv/geovannyrk" target="_blank" class="v3-join-btn">Únete a Geo Army</a>
        </div>
      </div>
    </nav>

    <main class="hw26-page">
      <a href="../index.html#wlHalloween" class="hw26-back-link">← VOLVER A HALLOWEEN</a>

      <div class="hw26-page-head">
        <div class="hw26-page-icon">📜</div>
        <div class="hw26-page-eyebrow">Halloween 2026 · Mundo 02</div>
        <div class="hw26-page-title">CONTRATOS</div>
        <div class="hw26-page-sub">Cumple los encargos de tu rol para atacar a Morvanna, curar a Geo Army o protegerla.</div>
        <div class="hw26-page-note">Nuevos contratos cada día · 22–31 de octubre</div>
      </div>

      <!-- PRÓXIMA OLEADA: lo rellena renderMissionDropNote() (solo fecha). -->
      <div class="hwc-drop-note" id="hw26MissionDropNote" hidden></div>

      <div class="hw26-page-content" id="hw26MissionsContent">
        <div class="hw26-empty-state">Cargando…</div>
      </div>

      <!-- Mensaje de éxito/error al tomar un contrato (showMissionClaimMessage). -->
      <div class="hwc-claim-msg" id="hw26MissionClaimMsg" role="status" aria-live="polite" hidden></div>

      <div class="hw26-error" id="hw26GlobalError" hidden></div>
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="../logo.png" alt="GeoArmy" class="footer-logo-img"/>
        GeoArmy
      </div>
      <div class="footer-text">Comunidad de Geovannyrk · Twitch Affiliate</div>
      <div class="footer-code">geovanyrk.github.io</div>
    </div>
  </footer>

  <script src="../js/premium.js"></script>
  <script src="../js/geoarmy-config.js"></script>
  <script src="../js/geoarmy-ranks.js"></script>
  <script src="../js/geoarmy-account.js"></script>
  <script src="../js/halloween-2026.js"></script>
</body>
</html>
