<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contratos — Halloween 2026 · GeoArmy</title>
  <meta name="description" content="Halloween 2026 — Contratos de Fortnite, Overwatch y stream contra La Heraldo."/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="../css/v3-theme.css"/>
  <link rel="stylesheet" href="../css/halloween-2026.css"/>
  <style>
    /* Contratos individuales reclamables (2026-10-10) -- scoped a esta
       página, NO se tocó css/halloween-2026.css ni css/style.css ni
       css/v3-theme.css. Reusa las custom properties ya definidas en esos
       archivos (con fallback) para no desentonar con la estética actual. */
    .hwc-claim-btn {
      display: inline-block;
      margin-top: .65rem;
      padding: .55rem 1rem;
      border: 1px solid var(--hw26-violet-line, rgba(138,92,246,.45));
      border-radius: .5rem;
      background: rgba(138,92,246,.16);
      color: var(--hw26-gold, #f3c969);
      font-family: 'Space Grotesk', sans-serif;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .hwc-claim-btn:hover:not(:disabled) { background: rgba(138,92,246,.28); }
    .hwc-claim-btn:disabled {
      cursor: not-allowed;
      opacity: .55;
      color: var(--hw26-text-dim, #9a94b5);
    }
    .hwc-claim-btn.hwc-claim-link { background: rgba(243,201,105,.12); }

    .hw26-mission-badge.is-claimed-mine { background: rgba(243,201,105,.22); color: var(--hw26-gold, #f3c969); }
    .hw26-mission-badge.is-claimed-other { background: rgba(154,148,181,.22); color: var(--hw26-text-dim, #9a94b5); }
    .hw26-mission-badge.is-completed { background: rgba(84,196,120,.22); color: #6fd68a; }
    .hw26-mission-badge.is-failed { background: rgba(214,80,80,.22); color: #e37878; }

    .hwc-claim-line {
      margin-top: .5rem;
      font-size: .85rem;
      color: var(--hw26-text-dim, #9a94b5);
    }
    .hwc-claim-line-mine { font-weight: 700; color: var(--hw26-gold, #f3c969); }
    .hwc-claim-line-sub { margin-top: .15rem; }
    .hwc-claim-line-failed { color: #e37878; }

    /* Teaser "PRÓXIMA OLEADA" -- reemplaza el texto estático fijo. */
    #hw26MissionDropNote {
      display: flex;
      align-items: flex-start;
      gap: .6rem;
      margin-top: .65rem;
    }
    #hw26MissionDropNote[hidden] { display: none; }
    .hwc-drop-icon { font-size: 1.3rem; line-height: 1; }
    .hwc-drop-body { display: flex; flex-direction: column; gap: .15rem; }
    .hwc-drop-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: .72rem;
      letter-spacing: .08em;
      color: var(--hw26-gold, #f3c969);
    }
    .hwc-drop-text { font-weight: 600; }
    .hwc-drop-sub { font-size: .82rem; color: var(--hw26-text-dim, #9a94b5); }

    /* Mensaje visible de resultado de un intento de tomar contrato. */
    .hwc-claim-msg {
      margin: 0 0 1rem;
      padding: .65rem .9rem;
      border-radius: .5rem;
      font-size: .9rem;
      font-weight: 600;
    }
    .hwc-claim-msg[hidden] { display: none; }
    .hwc-claim-msg.is-ok { background: rgba(84,196,120,.16); color: #6fd68a; border: 1px solid rgba(84,196,120,.35); }
    .hwc-claim-msg.is-error { background: rgba(214,80,80,.16); color: #e37878; border: 1px solid rgba(214,80,80,.35); }
  </style>
</head>
<!-- data-halloween-page="missions": el router carga
     halloween_2026_get_public_missions() + (2026-10-10) los contratos
     INDIVIDUALES reclamables de Fortnite/Overwatch -- claims públicos,
     próxima oleada, mi contrato activo -- con un poll de 20s. Los
     contratos STREAM/COMMUNITY no pasan por este sistema y conservan
     exactamente su comportamiento visual anterior. No toca estado de
     batalla, roles, efectos ni feed. -->
<body data-halloween-page="missions">

  <div class="v3-page">
    <div class="v3-stars"></div>
    <img src="../nebula-tl.webp" alt="" class="v3-nebula v3-nebula-tl"/>
    <img src="../nebula-tr.webp" alt="" class="v3-nebula v3-nebula-tr"/>
    <img src="../nebula-bl.webp" alt="" class="v3-nebula v3-nebula-bl"/>
    <img src="../nebula-br.webp" alt="" class="v3-nebula v3-nebula-br"/>

    <nav class="v3-nav">
      <div class="v3-nav-inner">
        <a href="../index.html" class="v3-logo nav-logo">
          <span class="v3-logo-mark"><img src="../logo.png" alt="GeoArmy"/></span>
          <span class="v3-wordmark">GEO ARMY</span>
        </a>
        <div class="v3-auth">
          <div id="geoAccountWidget"></div>
          <a href="https://twitch.tv/geovannyrk" target="_blank" class="v3-join-btn">Únete a Geo Army</a>
        </div>
      </div>
    </nav>

    <main class="hw26-page">
      <a href="../index.html#wlHalloween" class="hw26-back-link">← VOLVER A HALLOWEEN</a>

      <div class="hw26-page-head">
        <div class="hw26-page-icon">📜</div>
        <div class="hw26-page-eyebrow">Halloween 2026 · Mundo 02</div>
        <div class="hw26-page-title">CONTRATOS</div>
        <div class="hw26-page-sub">Cumple los encargos de Geo Army y debilita a La Heraldo.</div>
        <div class="hw26-page-note" id="hw26MissionDropNote" hidden></div>
      </div>

      <div id="hw26MissionClaimMsg" class="hwc-claim-msg" hidden></div>

      <div class="hw26-page-content" id="hw26MissionsContent">
        <div class="hw26-empty-state">Cargando…</div>
      </div>

      <div class="hw26-error" id="hw26GlobalError" hidden></div>
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="../logo.png" alt="GeoArmy" class="footer-logo-img"/>
        GeoArmy
      </div>
      <div class="footer-text">Comunidad de Geovannyrk · Twitch Affiliate</div>
      <div class="footer-code">geovanyrk.github.io</div>
    </div>
  </footer>

  <script src="../js/premium.js"></script>
  <script src="../js/geoarmy-config.js"></script>
  <script src="../js/geoarmy-ranks.js"></script>
  <script src="../js/geoarmy-account.js"></script>
  <script src="../js/halloween-2026.js"></script>
</body>
</html>
