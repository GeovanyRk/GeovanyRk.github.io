<!DOCTYPE html>

  <style>
    :root { color-scheme:dark; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#090a0d; color:#f6f4ee; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% -15%,rgba(222,168,42,.13),transparent 49%),radial-gradient(ellipse at 80% 85%,rgba(80,60,117,.08),transparent 38%); }
    header { position:relative; border-bottom:1px solid rgba(255,255,255,.07); }
    .nav { max-width:1120px; height:76px; margin:auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .brand { display:inline-flex; align-items:center; gap:11px; color:#f9f8f3; font-size:.9rem; font-weight:800; letter-spacing:.17em; text-decoration:none; white-space:nowrap; }
    .brand img { width:38px; height:38px; object-fit:contain; }
    .nav-link { color:#c7c4ba; font-size:.9rem; text-decoration:none; }
    .nav-link:hover { color:#f5d27a; }
    main { position:relative; max-width:700px; min-height:calc(100vh - 76px); margin:auto; padding:72px 24px 96px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .icon { width:76px; height:76px; margin-bottom:26px; display:grid; place-items:center; color:#f5cc67; background:linear-gradient(145deg,rgba(235,183,67,.14),rgba(235,183,67,.035)); border:1px solid rgba(235,183,67,.3); border-radius:22px; box-shadow:0 0 48px rgba(231,179,54,.09); }
    .icon svg { width:35px; height:35px; }
    .eyebrow { margin:0 0 17px; color:#eacb79; font-size:.72rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2.25rem,7vw,4rem); line-height:1.08; letter-spacing:-.045em; }
    h1 span { display:block; color:#e9c36a; }
    .copy { max-width:510px; margin:22px 0 0; color:#b8b8bd; font-size:1.05rem; line-height:1.7; }
    .status { margin:29px 0 0; padding:10px 16px; border:1px solid rgba(238,194,91,.2); border-radius:999px; color:#e4c679; background:rgba(237,187,77,.055); font-size:.85rem; font-weight:600; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:34px; }
    .button { min-height:46px; display:inline-flex; align-items:center; justify-content:center; padding:0 20px; border:1px solid rgba(255,255,255,.16); border-radius:12px; color:#eeeae0; background:rgba(255,255,255,.035); text-decoration:none; font-size:.9rem; font-weight:700; }
    .button.primary { color:#171207; background:#e9c36a; border-color:#e9c36a; }
    .button:hover { filter:brightness(1.1); }
    .button:focus-visible,.brand:focus-visible,.nav-link:focus-visible { outline:3px solid #ffe094; outline-offset:4px; }
    @media(max-width:480px) { .nav { height:68px; padding:0 18px; } main { min-height:calc(100vh - 68px); padding:56px 20px 80px; } .actions { width:100%; } .button { flex:1 1 100%; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; } }

</head>

        <path d="M17 3.5v2M16 4.5h2M19 14v2M18 15h2"/>
