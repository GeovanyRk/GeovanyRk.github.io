name: Validate Christmas staging
on:
  push:
    branches: ['staging/navidad-2026']
    paths: ['.github/workflows/stage-navidad-2026.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Copy missing font assets and validate launch
        shell: bash
        run: |
          set -euo pipefail
          src=$(mktemp -d)
          git clone --no-checkout https://github.com/GeovanyRk/geoarmy-v2.git "$src"
          git -C "$src" checkout --detach 3ffd3c7d871260b72a7efcdedd5e1a9451dc06cc
          mkdir -p assets/fonts
          for name in CINZEL-OFL.txt cinzel-latin-700-normal.woff2 cinzel-latin-900-normal.woff2; do
            test ! -e "assets/fonts/$name"
            cp "$src/assets/fonts/$name" "assets/fonts/$name"
            cmp "$src/assets/fonts/$name" "assets/fonts/$name"
          done
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('js/navidad-lanzamiento.js')
          js=p.read_text()
          old="""preview.onerror = function () {
                  preview.onerror = null;
                  preview.src = new URL('assets/navidad/planeta-santa-720.webp', document.baseURI).href;
                };"""
          # Match indentation independently; retry without a missing fallback asset.
          import re
          js,n=re.subn(r"preview\.onerror = function \(\) \{\s*preview\.onerror = null;\s*preview\.src = new URL\('assets/navidad/planeta-santa-720\.webp', document\.baseURI\)\.href;\s*\};","preview.onerror = function () { setTimeout(function(){launched=false;},30000); };",js,count=1)
          assert n==1
          p.write_text(js)
          for name in ['arbol','taller','cartas','lista','viaje','regalo']:
              p=pathlib.Path('navidad-'+name+'.html')
              html=p.read_text()
              old="if(Date.now()<Date.parse('2026-12-01T00:00:00-05:00'))location.replace('index.html');"
              assert html.count(old)==1
              new="""document.documentElement.style.visibility='hidden';document.addEventListener('DOMContentLoaded',async function(){try{var r=await fetch(window.GEOARMY_SUPABASE_URL+'/rest/v1/rpc/christmas_travel_v1',{method:'POST',headers:{apikey:window.GEOARMY_SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:'{}',cache:'no-store'});if(!r.ok)throw Error('clock');var data=await r.json();if(!(Date.parse(data.serverNow)>=Date.parse('2026-12-01T00:00:00-05:00')))throw Error('locked');document.documentElement.style.visibility='';}catch(e){location.replace('index.html');}},{once:true});"""
              p.write_text(html.replace(old,new,1))
          PY
          node --check js/navidad-lanzamiento.js
          node --check js/navidad-regalo.js
          node --check js/navidad-viaje.js
          node --check js/navidad-nav.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const code=fs.readFileSync('js/navidad-lanzamiento.js','utf8');
          async function run(initial){
            let now=0, timers=[], ids={}, all=[];
            function elem(tag){let e={tag,children:[],hidden:false,attrs:{},style:{},className:'',classList:{contains:()=>false,add(){},remove(){}},setAttribute(k,v){this.attrs[k]=v},removeAttribute(k){delete this.attrs[k];if(k==='href')delete this.href},appendChild(c){this.children.push(c);c.parentElement=this;c.parentNode=this},insertBefore(c,b){this.children.push(c);c.parentElement=this;c.parentNode=this},querySelector(k){return this.q?.[k]}};all.push(e);return e}
            const world=elem('div'),link=elem('a'),art=elem('img'),title=elem('span'),subtitle=elem('span');world.appendChild(link);link.appendChild(art);link.q={'img':art,'.world-02-open-title':title,'.world-02-open-sub':subtitle};link.href='onepiece.html';ids.wlOnePieceWorld=world;ids.wlOnePieceOpen=link;
            function Img(){let e=elem('img');e.naturalWidth=720;Object.defineProperty(e,'src',{set(v){this._src=v;if(this.onload)this.onload()},get(){return this._src}});return e}
            const w={GEOARMY_SUPABASE_URL:'https://example.invalid',GEOARMY_SUPABASE_ANON_KEY:'test'},ctx={window:w,document:{getElementById:k=>ids[k],createElement:elem,addEventListener(){},baseURI:'https://example.invalid/'},Image:Img,URL,Date,performance:{now:()=>now},fetch:async()=>({ok:true,json:async()=>({serverNow:initial})}),setInterval:f=>timers.push(f),setTimeout(){},console};vm.runInNewContext(code,ctx);await new Promise(r=>setImmediate(r));return {w,link,all,timers,advance(ms){now+=ms;for(const f of [...timers])f();}};
          }
          (async()=>{
            const before=await run('2026-12-01T04:59:59Z');assert.equal(before.w.__gaSantaMounted,undefined);assert.equal(before.link.href,'onepiece.html');before.advance(1000);assert.equal(before.w.__gaSantaMounted,true);
            const day=await run('2026-12-01T05:00:00Z');assert.equal(day.w.__gaSantaMounted,true);const temp=day.all.find(e=>e.className==='ga-onepiece-last');assert.equal(temp.hidden,false);assert.equal(temp.href,'onepiece.html');assert.equal(day.all.filter(e=>String(e.href).startsWith('navidad-')).length,6);
            day.advance(86400000);assert.equal(temp.hidden,true);
            const after=await run('2026-12-02T05:00:00Z');assert.equal(after.w.__gaSantaMounted,true);assert.equal(after.all.find(e=>e.className==='ga-onepiece-last').hidden,true);
            console.log('PASS: before Dec 1, launch, six pins, and Dec 2 automatic removal');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts navidad-*.html js/navidad-lanzamiento.js
          git commit -m "Complete missing assets and verify date transition"
          git push origin HEAD:staging/navidad-2026
